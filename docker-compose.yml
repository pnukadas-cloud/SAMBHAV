services:
  backend:
    build:
      context: ./backend
    environment:
      - DATABASE_URL=postgresql://sambhav:sambhav@postgres:5432/sambhav
      - REDIS_URL=redis://redis:6379/0
    ports:
      - "8000:8000"
    depends_on:
      - postgres
      - redis

  frontend:
    build:
      context: ./frontend
    environment:
      - VITE_API_BASE_URL=http://127.0.0.1:8000
    ports:
      - "5173:5173"
    depends_on:
      - backend

  postgres:
    image: postgres:17
    environment:
      - POSTGRES_USER=sambhav
      - POSTGRES_PASSWORD=sambhav
      - POSTGRES_DB=sambhav
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data

  redis:
    image: redis:8
    ports:
      - "6379:6379"

volumes:
  postgres-data:

