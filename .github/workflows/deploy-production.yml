name: SAMBHAV Production CI/CD Pipeline

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: production-deployment
  cancel-in-progress: false

jobs:
  # ============================================================================
  # 1. FRONTEND VALIDATION & BUILD
  # ============================================================================
  validate-frontend:
    name: Validate & Build Frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install Frontend Dependencies
        run: npm ci

      - name: Build Production SPA Bundle
        run: npm run build
        env:
          VITE_API_BASE_URL: ${{ vars.VITE_API_BASE_URL || 'https://sambhav-tawny.vercel.app' }}

      - name: Upload Frontend Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: frontend/dist/
          retention-days: 7

  # ============================================================================
  # 2. BACKEND & VERCEL SERVERLESS VALIDATION & TESTS
  # ============================================================================
  validate-backend:
    name: Validate & Test Backend & Vercel Entrypoint
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install Backend Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pytest httpx

      - name: Run Backend Pytest Suite
        run: python -m pytest backend/tests --maxfail=1 --disable-warnings -v
        env:
          DATABASE_URL: sqlite:///test_sambhav.db
          JWT_SECRET_KEY: test_ci_cd_secret_key_minimum_256_bits_length_for_pytest
          ENVIRONMENT: testing

      - name: Verify Vercel Serverless Entrypoint (api/index.py)
        run: |
          python -c "from api.index import app; from fastapi.testclient import TestClient; client = TestClient(app); res = client.get('/health'); assert res.status_code == 200, f'Expected 200, got {res.status_code}'; print('Vercel entrypoint /health OK:', res.json())"

  # ============================================================================
  # 3. FRONTEND DEPLOYMENT TO FIREBASE HOSTING (MAIN BRANCH ONLY)
  # ============================================================================
  deploy-frontend:
    name: Deploy Frontend to Firebase Hosting
    needs: [validate-frontend, validate-backend]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Download Frontend Build Artifact
        uses: actions/download-artifact@v4
        with:
          name: frontend-dist
          path: frontend/dist

      - name: Deploy to Firebase Hosting
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_SAMBHAV_QUANTUM_APP }}
          channelId: live
          projectId: sambhav-quantum-app

  # ============================================================================
  # 5. PRODUCTION SMOKE TESTS (MAIN BRANCH ONLY)
  # ============================================================================
  smoke-test:
    name: Production Smoke Tests
    needs: [deploy-frontend]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest

    steps:
      - name: Verify Live Production Frontend (Primary Domain)
        run: |
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" https://sambhav-quantum-app.web.app)
          echo "https://sambhav-quantum-app.web.app status code: $STATUS"
          if [ "$STATUS" -ne 200 ]; then
            echo "Warning: Expected 200 from primary domain, got $STATUS"
          else
            echo "Primary production domain verified successfully!"
          fi

      - name: Verify Live Production Frontend (Multi-site Domain)
        run: |
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" https://sambhav-quantum.web.app)
          echo "https://sambhav-quantum.web.app status code: $STATUS"
          if [ "$STATUS" -ne 200 ]; then
            echo "Warning: Expected 200 from multi-site domain, got $STATUS"
          else
            echo "Multi-site production domain verified successfully!"
          fi
