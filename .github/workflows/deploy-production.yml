name: SAMBHAV Production CI/CD Pipeline

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: production-deployment
  cancel-in-progress: false

jobs:
  # ============================================================================
  # 1. FRONTEND VALIDATION & BUILD
  # ============================================================================
  validate-frontend:
    name: Validate & Build Frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install Frontend Dependencies
        run: npm ci

      - name: Build Production SPA Bundle
        run: npm run build

      - name: Upload Frontend Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: frontend/dist/
          retention-days: 7

  # ============================================================================
  # 2. BACKEND VALIDATION & UNIT/INTEGRATION TESTS
  # ============================================================================
  validate-backend:
    name: Validate & Test Backend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install Backend Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pytest httpx

      - name: Run Pytest Test Suite
        run: python -m pytest --maxfail=1 --disable-warnings -v
        env:
          DATABASE_URL: sqlite:///test_sambhav.db
          JWT_SECRET_KEY: test_ci_cd_secret_key_minimum_256_bits_length_for_pytest
          ENVIRONMENT: testing

  # ============================================================================
  # 3. BACKEND DEPLOYMENT TO GOOGLE CLOUD RUN (MAIN BRANCH ONLY)
  # ============================================================================
  deploy-backend:
    name: Deploy Backend to Google Cloud Run
    needs: [validate-frontend, validate-backend]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest

    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        id: gcp-auth
        continue-on-error: true
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WIF_PROVIDER }}
          service_account: ${{ secrets.GCP_WIF_SERVICE_ACCOUNT }}
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Set up Google Cloud SDK
        if: steps.gcp-auth.outcome == 'success'
        uses: google-github-actions/setup-gcloud@v2
        with:
          project_id: ${{ secrets.GCP_PROJECT_ID }}

      - name: Deploy FastAPI Backend to Cloud Run
        if: steps.gcp-auth.outcome == 'success'
        run: |
          gcloud run deploy sambhav-backend \
            --source ./backend \
            --region us-central1 \
            --platform managed \
            --allow-unauthenticated \
            --set-env-vars "^@^ENVIRONMENT=production@FRONTEND_ORIGIN=https://sambhav-quantum-app.web.app@CORS_ORIGINS=https://sambhav-quantum-app.web.app,https://sambhav-quantum.web.app" \
            --quiet

  # ============================================================================
  # 4. FRONTEND DEPLOYMENT TO FIREBASE HOSTING (MAIN BRANCH ONLY)
  # ============================================================================
  deploy-frontend:
    name: Deploy Frontend to Firebase Hosting
    needs: [validate-frontend, validate-backend]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Download Frontend Build Artifact
        uses: actions/download-artifact@v4
        with:
          name: frontend-dist
          path: frontend/dist

      - name: Deploy to Firebase Hosting
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_SAMBHAV_QUANTUM_APP }}
          channelId: live
          projectId: sambhav-quantum-app

  # ============================================================================
  # 5. PRODUCTION SMOKE TESTS (MAIN BRANCH ONLY)
  # ============================================================================
  smoke-test:
    name: Production Smoke Tests
    needs: [deploy-frontend]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest

    steps:
      - name: Verify Live Production Frontend (Primary Domain)
        run: |
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" https://sambhav-quantum-app.web.app)
          echo "https://sambhav-quantum-app.web.app status code: $STATUS"
          if [ "$STATUS" -ne 200 ]; then
            echo "Warning: Expected 200 from primary domain, got $STATUS"
          else
            echo "Primary production domain verified successfully!"
          fi

      - name: Verify Live Production Frontend (Multi-site Domain)
        run: |
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" https://sambhav-quantum.web.app)
          echo "https://sambhav-quantum.web.app status code: $STATUS"
          if [ "$STATUS" -ne 200 ]; then
            echo "Warning: Expected 200 from multi-site domain, got $STATUS"
          else
            echo "Multi-site production domain verified successfully!"
          fi
